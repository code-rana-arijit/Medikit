apiVersion: apps/v1
kind: Deployment
metadata:
  name: prescription-service
  namespace: medikit
  labels:
    app: prescription-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prescription-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: prescription-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: prescription-service
          image: ghcr.io/code-rana-arijit/medikit/prescription-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8109
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: EUREKA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: EUREKA_SERVER
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: REDIS_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: DB_PASSWORD
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: medikit-db-config
                  key: prescription-service-db-url
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8109
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8109
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: prescription-service
  namespace: medikit
  labels:
    app: prescription-service
spec:
  selector:
    app: prescription-service
  ports:
    - port: 8109
      targetPort: 8109
      name: http
