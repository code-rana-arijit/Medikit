apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: medikit
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: config-server
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: config-server
          image: ghcr.io/code-rana-arijit/medikit/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: CONFIG_USERNAME
              value: "config"
            - name: CONFIG_PASSWORD
              value: "config"
            - name: EUREKA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: EUREKA_SERVER
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: REDIS_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: medikit
  labels:
    app: config-server
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
      name: http
