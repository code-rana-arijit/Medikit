apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-service
  namespace: medikit
  labels:
    app: loyalty-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loyalty-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: loyalty-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8112"
    spec:
      priorityClassName: medikit-high
      terminationGracePeriodSeconds: 30
      containers:
        - name: loyalty-service
          image: ghcr.io/code-rana-arijit/medikit/loyalty-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8112
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: EUREKA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: EUREKA_SERVER
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/medikit_loyalty"
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8112
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8112
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
  namespace: medikit
  labels:
    app: loyalty-service
spec:
  selector:
    app: loyalty-service
  ports:
    - port: 8112
      targetPort: 8112
      name: http
