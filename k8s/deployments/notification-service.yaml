apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: medikit
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8108"
    spec:
      priorityClassName: medikit-high
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: ghcr.io/code-rana-arijit/medikit/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8108
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: EUREKA_SERVER
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: EUREKA_SERVER
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: REDIS_PORT
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: medikit-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: NOTIFICATION_MOCK
              value: "${NOTIFICATION_MOCK:-true}"
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: medikit-secrets
                  key: TWILIO_ACCOUNT_SID
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: medikit-secrets
                  key: TWILIO_AUTH_TOKEN
                  optional: true
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: medikit-secrets
                  key: TWILIO_FROM_NUMBER
                  optional: true
            - name: SES_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: medikit-secrets
                  key: S3_ACCESS_KEY
                  optional: true
            - name: SES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medikit-secrets
                  key: S3_SECRET_KEY
                  optional: true
            - name: SES_REGION
              value: "${SES_REGION:-us-east-1}"
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8108
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8108
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: medikit
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 8108
      targetPort: 8108
      name: http
