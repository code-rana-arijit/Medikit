apiVersion: v1
kind: ConfigMap
metadata:
  name: medikit-common-config
  namespace: medikit
data:
  EUREKA_SERVER: "http://admin:admin@discovery-server:8761/eureka/"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  DB_USERNAME: "medikit"
  DB_PASSWORD: "medikit"
  SPRING_PROFILES_ACTIVE: "kubernetes"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
