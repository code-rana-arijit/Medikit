apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prescription-service-hpa
  namespace: medikit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prescription-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
