apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: medikit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: medikit
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - prescription-service
          - search-service
          - api-gateway
          - discovery-server
          - config-server
          - pgbouncer
          - postgres-exporter
          - redis-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9100
        - port: 9121
        - port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-ingress
  namespace: medikit
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-and-infra
  namespace: medikit
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - prescription-service
          - search-service
          - api-gateway
          - discovery-server
          - config-server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: discovery-server
      ports:
        - port: 8761
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: pgbouncer
      ports:
        - port: 6432
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: elasticsearch
      ports:
        - port: 9200
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - user-service
                  - product-service
                  - inventory-service
                  - cart-service
                  - order-service
                  - payment-service
                  - delivery-service
                  - notification-service
                  - prescription-service
                  - search-service
                  - api-gateway
      ports:
        - port: 8101
        - port: 8102
        - port: 8103
        - port: 8104
        - port: 8105
        - port: 8106
        - port: 8107
        - port: 8108
        - port: 8109
        - port: 8110
        - port: 8080
---
