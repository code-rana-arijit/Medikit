version: "3.9"

name: medikit

# =============================================================================
# Medikit local development infrastructure
# Run: docker compose up -d infra
# Run: docker compose up -d --build  (starts everything including services)
# =============================================================================

x-common-db: &common-db
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: medikit
    POSTGRES_PASSWORD: medikit
  volumes:
    - postgres_data:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U medikit"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  # ------------------------------ INFRASTRUCTURE -----------------------------
  postgres:
    <<: *common-db
    container_name: medikit-postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=400"]
    profiles: ["infra", "all"]

  redis:
    image: redis:7-alpine
    container_name: medikit-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["infra", "all"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: medikit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    profiles: ["infra", "all"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medikit-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    profiles: ["infra", "all"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: medikit-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    profiles: ["infra", "all"]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: medikit-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: ["infra", "all"]

  # ------------------------------ PLATFORM SERVICES --------------------------
  discovery-server:
    build: ./services/discovery-server
    container_name: medikit-discovery
    environment:
      EUREKA_HOSTNAME: discovery-server
      EUREKA_USERNAME: admin
      EUREKA_PASSWORD: admin
    ports:
      - "8761:8761"
    profiles: ["all", "services"]

  config-server:
    build: ./services/config-server
    container_name: medikit-config
    environment:
      CONFIG_USERNAME: config
      CONFIG_PASSWORD: config
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-}
    ports:
      - "8888:8888"
    profiles: ["all", "services"]

  api-gateway:
    build: ./services/api-gateway
    container_name: medikit-gateway
    depends_on:
      - discovery-server
      - redis
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2}
    ports:
      - "8080:8080"
    profiles: ["all", "services"]

  # ------------------------------ DOMAIN SERVICES ----------------------------
  user-service:
    build: ./services/user-service
    container_name: medikit-user
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_users
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2}
    ports:
      - "8101:8101"
    profiles: ["all", "services"]

  product-service:
    build: ./services/product-service
    container_name: medikit-product
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_products
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8102:8102"
    profiles: ["all", "services"]

  inventory-service:
    build: ./services/inventory-service
    container_name: medikit-inventory
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_inventory
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8103:8103"
    profiles: ["all", "services"]

  cart-service:
    build: ./services/cart-service
    container_name: medikit-cart
    depends_on:
      - discovery-server
      - redis
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      REDIS_HOST: redis
    ports:
      - "8104:8104"
    profiles: ["all", "services"]

  order-service:
    build: ./services/order-service
    container_name: medikit-order
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_orders
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8105:8105"
    profiles: ["all", "services"]

  payment-service:
    build: ./services/payment-service
    container_name: medikit-payment
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_payments
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8106:8106"
    profiles: ["all", "services"]

  delivery-service:
    build: ./services/delivery-service
    container_name: medikit-delivery
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_delivery
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8107:8107"
    profiles: ["all", "services"]

  notification-service:
    build: ./services/notification-service
    container_name: medikit-notification
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8108:8108"
    profiles: ["all", "services"]

  prescription-service:
    build: ./services/prescription-service
    container_name: medikit-prescription
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_prescriptions
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8109:8109"
    profiles: ["all", "services"]

  search-service:
    build: ./services/search-service
    container_name: medikit-search
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8110:8110"
    profiles: ["all", "services"]

  health-service:
    build: ./services/health-service
    container_name: medikit-health
    depends_on:
      - discovery-server
      - redis
      - kafka
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_health
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8111:8111"
    profiles: ["all", "services"]

  loyalty-service:
    build: ./services/loyalty-service
    container_name: medikit-loyalty
    depends_on:
      - discovery-server
      - redis
      - kafka
      - postgres
    environment:
      EUREKA_SERVER: http://admin:admin@discovery-server:8761/eureka/
      DB_URL: jdbc:postgresql://postgres:5432/medikit_loyalty
      DB_USERNAME: medikit
      DB_PASSWORD: medikit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8112:8112"
    profiles: ["all", "services"]

volumes:
  postgres_data:
  redis_data:
  es_data:
