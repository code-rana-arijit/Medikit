name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/medikit
  JAVA_VERSION: '17'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (all services)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp verify --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B -ntp verify sonar:sonar \
            -Dsonar.projectKey=medikit \
            -Dsonar.organization=${{ github.repository_owner }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -DskipTests

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build-and-test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [discovery-server, config-server, api-gateway, user-service, product-service, inventory-service, cart-service, order-service, payment-service, delivery-service, notification-service, prescription-service, search-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build, sonarqube]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          context: medikit-prod

      - name: Apply infrastructure
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/config/medikit-common-config.yaml
          kubectl apply -f k8s/base/config/medikit-db-config.yaml
          kubectl apply -f k8s/base/config/medikit-secrets.yaml || true

      - name: Deploy infrastructure workloads
        run: |
          kubectl apply -f k8s/postgres/postgres.yaml
          kubectl apply -f k8s/redis/redis.yaml
          kubectl apply -f k8s/kafka/kafka.yaml

      - name: Rollout & wait for service deployments
        run: |
          for svc in discovery-server config-server api-gateway user-service product-service inventory-service cart-service order-service payment-service delivery-service notification-service prescription-service search-service; do
            kubectl apply -f k8s/deployments/$svc.yaml
          done
          kubectl rollout status deployment -n medikit discovery-server config-server api-gateway --timeout=180s
          kubectl rollout status deployment -n medikit user-service product-service inventory-service cart-service order-service payment-service delivery-service notification-service prescription-service search-service --timeout=300s

      - name: Apply autoscaling & ingress
        run: |
          kubectl apply -f k8s/hpa/
          kubectl apply -f k8s/ingress/ingress.yaml

      - name: Verify deployment health
        run: |
          kubectl get pods -n medikit -o wide
          kubectl get hpa -n medikit
