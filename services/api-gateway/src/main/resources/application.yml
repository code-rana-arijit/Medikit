server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/pharmacists/**,/api/v1/admin/pharmacists/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RL_USER_REPLENISH:100}
                redis-rate-limiter.burstCapacity: ${RL_USER_BURST:200}
                key-resolver: "#{@compositeKeyResolver}"
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RL_IP_REPLENISH:500}
                redis-rate-limiter.burstCapacity: ${RL_IP_BURST:1000}
                key-resolver: "#{@ipKeyResolver}"
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/pharmacies/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RL_PRODUCT_USER_REPLENISH:200}
                redis-rate-limiter.burstCapacity: ${RL_PRODUCT_USER_BURST:400}
                key-resolver: "#{@compositeKeyResolver}"
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RL_PRODUCT_IP_REPLENISH:1000}
                redis-rate-limiter.burstCapacity: ${RL_PRODUCT_IP_BURST:2000}
                key-resolver: "#{@ipKeyResolver}"
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/delivery/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: prescription-service
          uri: lb://prescription-service
          predicates:
            - Path=/api/v1/prescriptions/**
        - id: health-service
          uri: lb://health-service
          predicates:
            - Path=/api/v1/health/**
        - id: loyalty-service
          uri: lb://loyalty-service
          predicates:
            - Path=/api/v1/loyalty/**
        - id: discount-service
          uri: lb://discount-service
          predicates:
            - Path=/api/v1/discounts/**,/api/v1/campaigns/**
      default-filters:
        - name: CircuitBreaker
          args:
            name: medikitGatewayCB
            fallbackUri: forward:/fallback/{status}
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RL_GLOBAL_USER_REPLENISH:50}
            redis-rate-limiter.burstCapacity: ${RL_GLOBAL_USER_BURST:100}
            key-resolver: "#{@compositeKeyResolver}"
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RL_GLOBAL_IP_REPLENISH:300}
            redis-rate-limiter.burstCapacity: ${RL_GLOBAL_IP_BURST:600}
            key-resolver: "#{@ipKeyResolver}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}
        max-redirects: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://admin:admin@localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}